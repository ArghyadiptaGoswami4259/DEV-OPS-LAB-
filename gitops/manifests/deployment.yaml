apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: default
  labels:
    app: gitops-demo
    student: arghyadipta-goswami
    roll: "2301010192"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
